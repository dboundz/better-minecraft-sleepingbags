plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = 'com.sleepingbag'

base {
    archivesName = 'sleepingbag'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = file("${System.getProperty('user.home')}/.cache/sleepingbag-build/runs/client")
        }
    }

    mods {
        sleepingbag {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

layout.buildDirectory = file("${System.getProperty('user.home')}/.cache/sleepingbag-build")
